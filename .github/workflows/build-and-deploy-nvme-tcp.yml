name: Build and Deploy NVMe-TCP Kernel Module

on:
  push:
    branches: [main, feat/*]
    paths:
      - "build/kernel/nvme/docker-nvme-tcp.sh"
      - ".github/workflows/build-and-deploy-nvme-tcp.yml"
  pull_request:
    branches: [main]
    paths:
      - "build/kernel/nvme/docker-nvme-tcp.sh"
      - ".github/workflows/build-and-deploy-nvme-tcp.yml"
  workflow_dispatch:
    inputs:
      version:
        description: "Kernel module version"
        required: true

concurrency:
  # The version is part of the group so that the poll workflow, which dispatches
  # one run per new upstream release in a loop, does not cancel its own runs:
  # they all target refs/heads/main and would otherwise share a single group,
  # leaving only the last release built. push/pull_request runs carry no version
  # input, so they share the "-ci" group and keep cancelling stale CI runs.
  group: build-and-deploy-nvme-tcp-${{ github.ref }}-${{ github.event.inputs.version || 'ci' }}
  cancel-in-progress: true

env:
  VERSION: ${{ inputs.version || 'stable-4230.2.2' }}
  # Real SDK build on main, and on any branch when explicitly dispatched, so a
  # change can be validated from its PR before merging. Automatic push and
  # pull_request runs on other refs stay cheap and use the stub module below.
  REAL_BUILD: ${{ github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch' }}

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        board_arch: [amd64, arm64]

    env:
      BOARD_ARCH: ${{ matrix.board_arch }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up QEMU
        if: matrix.board_arch == 'arm64'
        uses: docker/setup-qemu-action@v4

      - name: verify QEMU setup
        if: matrix.board_arch == 'arm64'
        run: |
          uname -m
          docker run --rm --platform linux/arm64 docker.io/alpine uname -m

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Run docker-nvme-tcp.sh
        if: env.REAL_BUILD == 'true'
        run: |
          if [ "${{ matrix.board_arch }}" = "arm64" ]; then
            echo "Building for ARM64 architecture"
          else
            echo "Building for AMD64 architecture"
          fi
          chmod +x build/kernel/nvme/docker-nvme-tcp.sh
          ./build/kernel/nvme/docker-nvme-tcp.sh

      - name: Simulate docker-nvme-tcp.sh output file
        if: env.REAL_BUILD != 'true'
        run: |
          mkdir -p build/kernel/nvme
          echo "dummy nvme tcp module" > build/kernel/nvme/nvme-tcp.ko.xz

      - name: Find built nvme-tcp.ko.xz
        id: find_nvme
        run: |
          find . -name nvme-tcp.ko.xz > nvme-tcp-path.txt
          NVME_PATH=$(head -n 1 nvme-tcp-path.txt)
          echo "nvme_path=$NVME_PATH" >> $GITHUB_OUTPUT

      - name: Upload nvme-tcp.ko.xz as artifact
        uses: actions/upload-artifact@v4
        with:
          name: nvme-tcp-ko-xz-${{ matrix.board_arch }}
          path: ${{ steps.find_nvme.outputs.nvme_path }}

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Download nvme-tcp.ko.xz artifact
        uses: actions/download-artifact@v8
        with:
          pattern: nvme-tcp-ko-xz-*
      - name: list built artifacts
        run: find ./ -name "*nvme*ko*"
      # Tag scheme must match what scripts/install-nvme-tcp/install-nvme-tcp-kernel-module.sh
      # downloads: nvme-tcp-<arch>-stable-<flatcar_version>, asset nvme-tcp.ko.xz.
      # NOTE: the install script hardcodes the "stable" channel, so lts-* releases
      # are not yet downloadable by it; that's a pre-existing script limitation.
      - name: Create release for amd64
        if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: nvme-tcp-amd64-${{ env.VERSION }}
          name: NVMe-TCP Kernel Module (amd64) for Flatcar Container Linux ${{ env.VERSION }}
          files: nvme-tcp-ko-xz-amd64/nvme-tcp.ko.xz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Create release for arm64
        if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: nvme-tcp-arm64-${{ env.VERSION }}
          name: NVMe-TCP Kernel Module (arm64) for Flatcar Container Linux ${{ env.VERSION }}
          files: nvme-tcp-ko-xz-arm64/nvme-tcp.ko.xz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
